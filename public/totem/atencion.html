    <meta http-equiv="refresh" content="0; url=../totem-local">
    <title>SDI · Tótem local</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            font-family: Arial, sans-serif;

            color: #123532;
        }
        .card {
            width: min(720px, calc(100% - 32px));

        }
        a {
            display: inline-block;
            margin-top: 20px;
            padding: 14px 22px;
            border-radius: 14px;
            background: #087f6f;
            color: white;
            text-decoration: none;
            font-weight: 700;
        }
    </style>
</head>
<body>
    <section class="card">
        <h1>Abriendo tótem de atención</h1>
